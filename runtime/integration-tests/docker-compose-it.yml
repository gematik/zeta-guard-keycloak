name: "zeta-guard"

networks:
  zeta-guard:
    name: zeta-guard

services:
  keycloak-db:
    image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX:+$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/}postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: zeta-guard
      POSTGRES_PASSWORD: geheim
    networks:
      - zeta-guard
    ports:
      - "15432:5432"
    healthcheck:
      test: pg_isready -h localhost -p 5432 -U zeta-guard -d keycloak
      interval: 3s
      timeout: 3s
      retries: 5

  keycloak:
    # Keycloak writes logs and the jacoco exec file into the mounted ./target. Under rootless Docker the
    # image's own user maps to an unprivileged host uid, leaving those files undeletable for `mvn clean`;
    # set DOCKER_USER=0 there.
    user: ${DOCKER_USER:-keycloak}
    image: ${IMAGE_NAME:-zeta/zeta-guard/keycloak-zeta}:${IMAGE_TAG:-latest}
    # 'container_name' property set for service 'keycloak' but this property is not supported by Testcontainers, consider removing it
    environment:
      PRINT_ENV: true
      JAVA_LOCALE: -Duser.timezone=Europe/Berlin
      JAVA_OPTS_APPEND: -ea ${COVERAGE_OPTS} ${PROFILING_OPTS}

      # Put Keycloak build options in the first build stage of the container image
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: zeta-guard
      KC_DB_PASSWORD: geheim
      KC_BOOTSTRAP_ADMIN_USERNAME: zeta
      KC_BOOTSTRAP_ADMIN_PASSWORD: sigma
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME: http://localhost:18080
      KC_HTTP_ENABLED: true
      KC_TRACING_ENABLED: true
      KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_DECISION_PATH: "/v1/data/policies/zeta/authz/decision"
      KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_OPA_SIMULATION_BASE_URL: "http://opa-simulation:8181"
      # https://www.keycloak.org/docs/latest/upgrading/#maximum-length-of-the-parameters-in-the-oidc-token-endpoint
      KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_REQ_PARAMS_DEFAULT_MAX_SIZE: 10000
      # Initial hash for admin events log
      GENESIS_HASH: ${GENESIS_HASH:-4841c2142fef441daa6ee6c57db65c011935964b14e94a6c8f5ec0447b83526c}
      SMCB_HASHING_PEPPER: ${SMCB_HASHING_PEPPER:-085c1245-dc0d-4d39-95b4-97496bec6182}
      # Where to find SMC-B certificates and how to read them
      SMCB_KEYSTORE_LOCATION: /opt/keycloak/conf/smcb-certificates.p12
      SMCB_KEYSTORE_PASSWORD: "tyqvHpFoHdu68yRE+0F4q/I"
      SMCB_KEYSTORE_META_LOCATION: /opt/keycloak/conf/smcb-certificates-meta.json
      SMCB_USER_MAX_CLIENTS: 20
      ZETA_OIDC_FLOW_ENABLED: ${ZETA_OIDC_FLOW_ENABLED:-false}
      TPM_KEYSTORE_LOCATION: /opt/keycloak/conf/tpm-certificates.p12
      TPM_KEYSTORE_PASSWORD: "O3Bdel9P5+cOgzIGANkOPEzBQM3V"
      # OCSP_KEYSTORE_LOCATION: /opt/keycloak/conf/ocsp-signers.p12
      # OCSP_KEYSTORE_PASSWORD: "oGxkNU73WYIGpNTfWgeU"
      # OCSP_KEYSTORE_META_LOCATION: /opt/keycloak/conf/ocsp-signers-meta.json
      CLIENT_REGISTRATION_TTL: "PT4S"
      SMCB_IDLE_CLIENT_TTL: "PT4S"
      SMCB_IDLE_USER_TTL: "PT4S"
      CLIENT_REGISTRATION_SCHEDULER_INTERVAL: "PT3S"
      # Exercise the truststore reload loop on every IT run: it hashes the truststores every few seconds and must keep
      # finding them unchanged. A broken schedule, read or comparison therefore shows up in the whole suite.
      TRUSTSTORE_RELOAD_INTERVAL: "PT5S"
      HSM_PROXY_ENDPOINT: "hsm-sim:50051"
      HSM_PROXY_KEY_ID: "zeta-guard-keycloak-tls-es256-v1.p256"
      HSM_PROXY_TOKEN_KEY_ID: "zeta-guard-keycloak-token-es256-v1.p256"
      # HsmTokenSigningKeyProviderFactory's fail-closed guard defaults to ON
      # (HsmTokenSigningKeyProviderFactory.failClosed = true). No env var needed in the IT;
      # set KC_SPI_KEYS_ZETA_HSM_TOKEN_SIGNING_FAIL_CLOSED=false to relax for debugging.
      # NOTE: KC_SPI_KEYS_ZETA_HSM_TOKEN_SIGNING_ENABLED is reserved by Keycloak's SPI loader
      # (DefaultKeycloakSessionFactory.isEnabled) — do not use it to control the guard.
      HSM_PROXY_KEK_ID: "vau-db-kek-v1"
      SPREE_INTEGRITY_PROVIDER_ENABLED: true
      SPREE_ENABLE_INTEGRITY_CHECK: true
      SPREE_SHUTDOWN_ON_ERROR: true
      SPREE_ENCRYPTED_REALM: "zeta-guard"
      SPREE_BOOTSTRAP_INTERVAL: "PT30S"
    env_file:
      - ../conf/spree-keychain.env
    ports:
      - "127.0.0.1:18080:8080" # api port
      - "19000:9000" # mgmt
    networks:
      - zeta-guard
    volumes:
      - ../smcb-certificates.p12:/opt/keycloak/conf/smcb-certificates.p12
      - ../smcb-certificates-meta.json:/opt/keycloak/conf/smcb-certificates-meta.json
      - ../tpm-certificates.p12:/opt/keycloak/conf/tpm-certificates.p12
      - ../ocsp-signers.p12:/opt/keycloak/conf/ocsp-signers.p12
      - ../ocsp-signers-meta.json:/opt/keycloak/conf/ocsp-signers-meta.json
      - ./target/classes/libs/jacoco-agent.jar:/opt/keycloak/bin/jacoco-agent.jar
      - ./target:/opt/keycloak/data
    # Give KC more time to write logs and jacoco exec file
    stop_grace_period: 30s
    healthcheck:
      # No curl in Keycloak 🙄
      test: |
        exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nhost: localhost:9000\r\nConnection: close\r\n\r\n" >&3;grep "HTTP/1.1 200 OK" <&3
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      keycloak-db:
        condition: service_healthy
      hsm-sim:
        condition: service_started
    command: start --log="console,file" --optimized

  keycloak-config-cli:
    image: ${IMAGE_KEYCLOAK_CONFIG:-zeta/zeta-guard/keycloak-config-cli}
    environment:
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_USER: zeta
      KEYCLOAK_PASSWORD: sigma
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES: "/config/*"
      # See https://github.com/adorsys/keycloak-config-cli?tab=readme-ov-file#variable-substitution
      IMPORT_VARSUBSTITUTION_ENABLED: true
      ADMIN_EVENT_LOGGING_ENABLED: true
      ADMIN_EVENT_LOGGING_DETAILS_ENABLED: true
      # HSM token signing — registers KeyProvider and removes software signing keys
      HSM_TOKEN_SIGNING_ENABLED: "true"
      HSM_TOKEN_SIGNING_ENDPOINT: "hsm-sim:50051"
      HSM_TOKEN_SIGNING_KEY_ID: "zeta-guard-keycloak-token-es256-v1.p256"
      POSTGRES_HOST: keycloak-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: keycloak
      POSTGRES_USER: zeta-guard
      POSTGRES_PASSWORD: geheim
      SPREE_INTEGRITY_PROVIDER_ENABLED: true
      SPREE_ENABLE_INTEGRITY_CHECK: true
      SPREE_ENABLE_INTEGRITY_TABLE_CHECK: true
      SPREE_ENCRYPTED_REALM: "zeta-guard"
      ZETA_OIDC_FLOW_ENABLED: ${ZETA_OIDC_FLOW_ENABLED:-false}
    networks:
      - zeta-guard
    volumes:
      - ../realms:/config
      - ./scripts-it:/opt/keycloak/scripts
      - ./scripts-repository:/opt/keycloak/scripts-repository

  hsm-sim:
    image: ${HSM_SIM_IMAGE:-zeta/zeta-guard/ngx_pep/hsm_sim}:${HSM_SIM_TAG:-main}
    command: ["--listen", "0.0.0.0:50051", "--keys-dir", "/etc/hsm_sim/keys"]
    networks:
      - zeta-guard

  opa:
    image: openpolicyagent/opa:1.11.0-static
    command:
      - run
      - --server
      - --log-level=info
      - --addr=0.0.0.0:8181
      - --diagnostic-addr=0.0.0.0:8282
      - /bundle
    volumes:
      - ../opa/opa-active:/bundle:ro
    ports:
      - "18181:8181"   # OPA API
      - "18282:8282"   # OPA diagnostics
    networks:
      - zeta-guard

  opa-simulation:
    image: openpolicyagent/opa:1.14.0-static
    command:
      - run
      - --server
      - --log-level=info
      - --addr=0.0.0.0:8181
      - --diagnostic-addr=0.0.0.0:8282
      - /bundle
    volumes:
      - ../opa/opa-simulation:/bundle:ro
    ports:
      - "18183:8181"   # OPA simulation API
      - "18284:8282"   # OPA simulation diagnostics
    networks:
      - zeta-guard
