entities:
  - entity:
      name: org.keycloak.models.jpa.entities.UserEntity
      encrypted_properties:
        - name: email
        - name: emailConstraint
      ignored_properties:
        - name: federatedIdentities

  - entity:
      name: org.keycloak.models.jpa.entities.CredentialEntity
      encrypted_properties:
        - name: credentialData
        - name: secretData

  - entity:
      name: org.keycloak.models.jpa.entities.UserAttributeEntity
      encrypted_properties:
        - name: value
        - name: longValue
      primary_key:
        class_name: java.lang.String
        properties:
          - name: id
      named_queries:
        - query:
            # This query is used in [org.keycloak.models.jpa.UserAdapter.removeAttribute] and causes an abandoned row checksum
            name: deleteUserAttributesByNameAndUser
            query_type: DELETE
            check_query: true

  - entity:
      name: org.keycloak.models.jpa.entities.ClientScopeClientMappingEntity
      primary_key:
        class_name: org.keycloak.models.jpa.entities.ClientScopeClientMappingEntity$Key
        properties:
          - name: clientScopeId
          - name: clientId
      named_queries:
        - query:
            # This query is executed when expired clients are being removed
            name: deleteClientScopeClientMappingByClient
            query_type: DELETE
            check_query: true
        - query:
            name: addClientScopeToAllClients
            query_type: INSERT
            check_query: true

  - entity:
      name: org.keycloak.models.jpa.entities.ClientEntity
      encrypted_properties:
        - name: secret

  - entity:
      name: org.keycloak.models.jpa.entities.ClientAttributeEntity
      encrypted_properties:
        - name: value

  - entity:
      name: org.keycloak.models.jpa.entities.ComponentConfigEntity
      encrypted_properties:
        - name: value

  - entity:
      name: org.keycloak.models.jpa.entities.RevokedTokenEntity

  - entity:
      name: org.keycloak.models.jpa.entities.RequiredCredentialEntity

  - entity:
      name: org.keycloak.models.jpa.entities.FederatedIdentityEntity

  - entity:
      name: org.keycloak.models.jpa.entities.RoleEntity

  - entity:
      name: org.keycloak.models.jpa.entities.RoleAttributeEntity

  - entity:
