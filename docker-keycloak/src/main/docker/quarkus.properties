# Force BouncyCastle to be loaded ONLY by the system classloader (where startup.sh puts it on
# the bootstrap classpath). Without this, BC is loaded twice — once by the system loader for
# JVM Security init (security.provider.1=BC, needed for HSM-TLS) and once by the Quarkus loader
# for code in lib/lib/main/ and providers/ (Spree integrity, etc.). The two BC instances have
# different Class identities, so a KeySpec built against one BC's classes is rejected by the
# other BC's KeyFactorySpi.engineGeneratePrivate as "key spec not recognized".
#
# Symptom without this setting (with -Xbootclasspath/a:bcprov in startup.sh):
#   java.security.spec.InvalidKeySpecException: key spec not recognized
#     at org.bouncycastle.jcajce.provider.asymmetric.ec.KeyFactorySpi.engineGeneratePrivate
#     at de.spree.keycloak.commons.EncodingUtilKt.toKeyPair  (Spree integrity bootstrap)
quarkus.class-loading.parent-first-artifacts=org.bouncycastle:bcprov-jdk18on

# Disable the HTTP-server metrics binder: Quarkus HttpCommonTags leaves the `method` tag unbounded,
# so arbitrary HTTP methods grow http_server_requests without limit → OOM. Re-enable once the base
# ships the Quarkus fix (>= 3.33.3.1, Keycloak >= 26.7.2). JVM/DB/cache metrics are unaffected.
quarkus.micrometer.binder.http-server.enabled=false

# Resource servers calling userinfo/email: behind an ingress the client certificate arrives via Keycloak's nginx
# x509cert-lookup with trust-proxy-verification=false (the plugin checks the chain). For every such request the lookup
# fails to rebuild the chain from Keycloak's own truststore and logs a WARN plus a misleading INFO ("... client
# certificate authentication will fail"), although the certificate is handed over and validated. Quarkus' cleanup
# filter demotes exactly these two messages of this one logger to DEBUG; everything else is untouched and ERROR is never
# affected. To see them again: KC_LOG_LEVEL=...,org.keycloak.services.x509.NginxProxySslClientCertificateLookup:debug
# Not set via QUARKUS_* env var: the map key is the case-sensitive logger name, an env var name delivers it lowercased.
quarkus.log.filter."org.keycloak.services.x509.NginxProxySslClientCertificateLookup".if-starts-with=No issuer certificate for certificate in certification path found.,Impossible to rebuild end user cert chain
quarkus.log.filter."org.keycloak.services.x509.NginxProxySslClientCertificateLookup".target-level=DEBUG
